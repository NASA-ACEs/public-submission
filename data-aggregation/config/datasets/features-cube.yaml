# fuel-lake — dataset: gold datacube features/<aoi>/cube.zarr (feature layer)
# Licensed under Apache-2.0.
# Gold collection (no connector: written by `fuellake build-features`). Must equal
# fuellake.features._common.GOLD_CONFIGS["features-cube"], the built-in fallback (checked by tests/test_features_cube.py).
id: features-cube
title: "fuel-lake gold datacube (AOI grid; time, y, x)"
kind: raster-b
connector: null
status: unverified
scales: [local, region]                 # informational: built by fuellake build-features, not by the pipeline
provider: "fuel-lake feature layer (fuellake.features.cube), derived from cataloged staged items"
homepage: null
access: {method: "lake: features/<aoi>/cube.zarr (Zarr v3)", auth: none, env: []}
license:
  id: various
  url: null
  redistributable: false
  attribution: "Derived from the input datasets listed in the item property fuellake:source_ids; each input keeps its own licence (fuellake:input_licenses)."
  notes: "Derived product. Redistributable only if every input is: see the item property fuellake:redistributable."
cadence: on build (fuellake build-features)
native_resolution: AOI grid (30 m for smm) or a coarser requested resolution
variables: []
caveats:
  - "Variables depend on what is staged: see the item properties fuellake:variables and fuellake:missing_datasets."
  - "Dynamic variables are (time, y, x) with time = union of their UTC acquisition dates; NaN where a variable has no scene that day. Static variables are (y, x)."
  - "Weather (form B) is regridded bilinearly to the cube grid and sampled on the cube dates (daily mean of the store's time steps on that UTC day, NaN if missing)."
  - "NISAR series never mix maturities unless built with allow_mixed_maturity=True."
  - "Tested on synthetic lakes only (offline tests)."
options:
  static_datasets: [cop-dem, landfire-fbfm40, biomass]   # form A datasets treated as time-invariant
  split_by: {biomass: "fuellake:biomass_component"}      # item property -> separate series (biomass_live ...)
  time_chunk: 8
  space_chunk: 256
  weather_cadence_days: 1   # no form A scene dates in the period (e.g. AOI ca): weather every N days
