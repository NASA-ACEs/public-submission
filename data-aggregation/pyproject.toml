# fuel-lake — project metadata, dependencies and tool configuration
# Licensed under Apache-2.0.

[project]
name = "fuel-lake"
version = "0.1.0"
description = "Small data lake, ETL and STAC catalog for soil moisture -> live fuel moisture -> fire spread risk (NASA Space Apps 2026)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "fuel-lake team (NASA Space Apps 2026)" }]
dependencies = [
    "pystac>=1.10",
    "pystac-client>=0.8",
    "rasterio>=1.4",
    "rioxarray>=0.17",
    "xarray>=2025.1",
    "zarr>=3.0,<4",
    "dask>=2024.12",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "affine>=2.4",
    "fsspec>=2024.10",
    "s3fs>=2024.10",
    "aiohttp>=3.10",
    "requests>=2.32",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "h5py>=3.11",
    "h5netcdf>=1.3",
    "netCDF4>=1.7",
    "scipy>=1.13",
    "cdsapi>=0.7.7",
]

[project.scripts]
fuellake = "fuellake.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[server]>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuellake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not network and not earthdata'"
markers = [
    "network: needs internet access (live endpoint)",
    "earthdata: needs EARTHDATA_TOKEN and internet access",
    "slow: slow test (large data or long runtime)",
]
filterwarnings = [
    "ignore::DeprecationWarning:botocore.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]   # typer uses function calls in argument defaults
